services:
  postgres:
    image: postgres:16-alpine
    container_name: acordos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-acordos_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-acordos_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.7
    container_name: acordos-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs
      DEFAULT_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"sqs\": \"\\(available\\|running\\)\"'"]
      interval: 5s
      timeout: 5s
      retries: 15

  sqs-init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acordos-sqs-init
    env_file:
      - .env
    depends_on:
      localstack:
        condition: service_healthy
    command:
      - python
      - -c
      - |
        import json, boto3, os
        sqs = boto3.client(
            "sqs",
            region_name=os.getenv("AWS_REGION", "us-east-1"),
            endpoint_url=os.getenv("AWS_ENDPOINT_URL", "http://localstack:4566"),
            aws_access_key_id=os.getenv("AWS_ACCESS_KEY_ID", "test"),
            aws_secret_access_key=os.getenv("AWS_SECRET_ACCESS_KEY", "test"),
        )
        dlq_name = os.getenv("SQS_DLQ_NAME", "acordos-juridicos-dlq")
        q_name = os.getenv("SQS_QUEUE_NAME", "acordos-juridicos-queue")
        dlq_resp = sqs.create_queue(QueueName=dlq_name)
        dlq_arn = sqs.get_queue_attributes(QueueUrl=dlq_resp["QueueUrl"], AttributeNames=["QueueArn"])["Attributes"]["QueueArn"]
        redrive = json.dumps({"deadLetterTargetArn": dlq_arn, "maxReceiveCount": "3"})
        q_resp = sqs.create_queue(QueueName=q_name, Attributes={"RedrivePolicy": redrive, "VisibilityTimeout": "60"})
        print(f"SQS queues initialized: {q_resp['QueueUrl']} (DLQ: {dlq_resp['QueueUrl']})")

  producer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acordos-producer
    env_file:
      - .env
    depends_on:
      sqs-init:
        condition: service_completed_successfully
    command: ["python", "-m", "services.producer.main"]

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acordos-consumer
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      sqs-init:
        condition: service_completed_successfully
    command: ["python", "-m", "services.consumer.main"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acordos-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uvicorn", "services.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  postgres_data:
