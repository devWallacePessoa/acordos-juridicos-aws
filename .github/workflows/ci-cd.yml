name: CI/CD - Acordos Juridicos AWS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  PYTHON_VERSION: "3.12"
  AWS_REGION: "us-east-2"

jobs:
  lint-and-test:
    name: Qualidade, Lint (Ruff) e Testes (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Analisar código com Ruff (Linter)
        run: |
          ruff check shared services tests

      - name: Executar Testes Unitários e de Integração com Cobertura
        run: |
          pytest --cov=shared --cov=services --cov-report=term-missing --cov-fail-under=85

  terraform-validate:
    name: Validação de Infraestrutura como Código (Terraform)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Terraform Format Check & Validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate

  auto-pr-develop-to-main:
    name: Abrir PR Automático (develop -> main)
    runs-on: ubuntu-latest
    needs: [lint-and-test, terraform-validate]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    steps:
      - name: Criar ou verificar Pull Request de develop para main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list --repo "${{ github.repository }}" --head develop --base main --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            echo "Pull Request #$EXISTING_PR já está aberto e foi atualizado automaticamente."
          else
            gh pr create \
              --repo "${{ github.repository }}" \
              --base main \
              --head develop \
              --title "chore(release): merge develop into main (${{ github.sha }})" \
              --body "Pull Request criado automaticamente pelo GitHub Actions após aprovação nos testes unitários, integração (Pytest) e validação do Terraform."
          fi

  docker-build-and-deploy:
    name: Terraform Apply, Build Docker & Deploy AWS ECR/ECS/API Gateway
    runs-on: ubuntu-latest
    needs: [lint-and-test, terraform-validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ECR_REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Validar build da imagem Docker
        run: |
          docker build -t acordos-juridicos-aws:${{ github.sha }} .

      - name: Validar credenciais AWS obrigatorias nas Secrets do GitHub
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::As secrets AWS_ACCESS_KEY_ID e/ou AWS_SECRET_ACCESS_KEY nao estao configuradas em Settings -> Secrets and variables -> Actions (Repository secrets)."
            exit 1
          fi

      - name: Sincronizar Terraform (Backend S3) e Aplicar Infraestrutura na AWS
        working-directory: infra/terraform
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          TF_BUCKET="acordos-juridicos-tfstate-${ACCOUNT_ID}-${AWS_REGION}"

          echo "=== 0. Garantindo Bucket S3 (${TF_BUCKET}) para o Estado do Terraform ==="
          if ! aws s3api head-bucket --bucket "$TF_BUCKET" --region "$AWS_REGION" 2>/dev/null; then
            aws s3api create-bucket \
              --bucket "$TF_BUCKET" \
              --region "$AWS_REGION" \
              --create-bucket-configuration LocationConstraint="$AWS_REGION"
            aws s3api put-bucket-versioning \
              --bucket "$TF_BUCKET" \
              --versioning-configuration Status=Enabled \
              --region "$AWS_REGION"
          fi

          cat > backend.tf <<EOF
          terraform {
            backend "s3" {
              bucket = "${TF_BUCKET}"
              key    = "prod/terraform.tfstate"
              region = "${AWS_REGION}"
            }
          }
          EOF

          terraform init -reconfigure

          # Remove APIs duplicadas criadas acidentalmente antes da importacao do state, mantendo a principal (5c0bm1ew3d)
          ALL_APIS=$(aws apigatewayv2 get-apis --region "$AWS_REGION" --query "Items[?Name=='acordos-juridicos-prod-http-api'].ApiId" --output text)
          for CANDIDATE_API in $ALL_APIS; do
            if [ "$CANDIDATE_API" != "5c0bm1ew3d" ] && [ -n "$CANDIDATE_API" ] && [ "$CANDIDATE_API" != "None" ]; then
              echo "Removendo API Gateway duplicado: $CANDIDATE_API"
              aws apigatewayv2 delete-api --api-id "$CANDIDATE_API" --region "$AWS_REGION" || true
            fi
          done

          # Garante que o state aponte para a API principal 5c0bm1ew3d
          CURRENT_API_STATE=$(terraform state show aws_apigatewayv2_api.http_api 2>/dev/null | grep 'id.*=' | head -n 1 | awk -F'"' '{print $2}' || true)
          if [ -n "$CURRENT_API_STATE" ] && [ "$CURRENT_API_STATE" != "5c0bm1ew3d" ]; then
            terraform state rm aws_apigatewayv2_route.proxy_route || true
            terraform state rm aws_apigatewayv2_stage.default || true
            terraform state rm aws_apigatewayv2_integration.api_proxy || true
            terraform state rm aws_apigatewayv2_api.http_api || true
            API_ID="5c0bm1ew3d"
            INTEGRATION_ID=$(aws apigatewayv2 get-integrations --api-id "$API_ID" --region "$AWS_REGION" --query "Items[0].IntegrationId" --output text)
            ROUTE_ID=$(aws apigatewayv2 get-routes --api-id "$API_ID" --region "$AWS_REGION" --query "Items[?RouteKey=='ANY /{proxy+}'].RouteId | [0]" --output text)
            terraform import aws_apigatewayv2_api.http_api "$API_ID" || true
            terraform import aws_apigatewayv2_integration.api_proxy "${API_ID}/${INTEGRATION_ID}" || true
            terraform import aws_apigatewayv2_route.proxy_route "${API_ID}/${ROUTE_ID}" || true
            terraform import aws_apigatewayv2_stage.default "${API_ID}/\$default" || true
          fi

          # Importa recursos existentes caso ainda nao constem no tfstate remoto no S3
          if ! terraform state show aws_ecr_repository.app_repo >/dev/null 2>&1; then
            echo "Sincronizando recursos existentes da AWS para o estado remoto no S3..."
            API_ID=$(aws apigatewayv2 get-apis --region "$AWS_REGION" --query "Items[?Name=='acordos-juridicos-prod-http-api'].ApiId | [0]" --output text)
            INTEGRATION_ID=$(aws apigatewayv2 get-integrations --api-id "$API_ID" --region "$AWS_REGION" --query "Items[0].IntegrationId" --output text)
            ROUTE_ID=$(aws apigatewayv2 get-routes --api-id "$API_ID" --region "$AWS_REGION" --query "Items[0].RouteId" --output text)
            ECS_SG_ID=$(aws ec2 describe-security-groups --region "$AWS_REGION" --filters "Name=group-name,Values=acordos-juridicos-prod-ecs-sg" --query "SecurityGroups[0].GroupId" --output text)
            RDS_SG_ID=$(aws ec2 describe-security-groups --region "$AWS_REGION" --filters "Name=group-name,Values=acordos-juridicos-prod-rds-sg" --query "SecurityGroups[0].GroupId" --output text)
            TASK_DEF_ARN=$(aws ecs describe-task-definition --task-definition acordos-juridicos-prod-api --region "$AWS_REGION" --query "taskDefinition.taskDefinitionArn" --output text)

            terraform import aws_sqs_queue.acordos_dlq "https://sqs.${AWS_REGION}.amazonaws.com/${ACCOUNT_ID}/acordos-juridicos-prod-dlq" || true
            terraform import aws_sqs_queue.acordos_queue "https://sqs.${AWS_REGION}.amazonaws.com/${ACCOUNT_ID}/acordos-juridicos-prod-queue" || true
            terraform import aws_ecr_repository.app_repo "acordos-juridicos-prod-repo" || true
            terraform import aws_security_group.ecs_sg "$ECS_SG_ID" || true
            terraform import aws_security_group.rds_sg "$RDS_SG_ID" || true
            terraform import aws_db_subnet_group.rds_subnet_group "acordos-juridicos-prod-db-subnet-group" || true
            terraform import aws_db_instance.postgres "acordos-juridicos-prod-db" || true
            terraform import aws_cloudwatch_log_group.api_logs "/aws/ecs/acordos-juridicos-prod-api" || true
            terraform import aws_cloudwatch_log_group.consumer_logs "/aws/ecs/acordos-juridicos-prod-consumer" || true
            terraform import aws_iam_role.ecs_task_execution_role "acordos-juridicos-prod-ecs-exec-role" || true
            terraform import aws_iam_role_policy_attachment.ecs_exec_policy "acordos-juridicos-prod-ecs-exec-role/arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy" || true
            terraform import aws_iam_role.ecs_task_role "acordos-juridicos-prod-ecs-task-role" || true
            terraform import aws_iam_role_policy.sqs_access_policy "acordos-juridicos-prod-ecs-task-role:acordos-juridicos-prod-sqs-policy" || true
            terraform import aws_ecs_cluster.main "acordos-juridicos-prod-cluster" || true
            terraform import aws_ecs_task_definition.api_task "$TASK_DEF_ARN" || true
            terraform import aws_ecs_service.api_service "acordos-juridicos-prod-cluster/acordos-juridicos-prod-api-service" || true
            terraform import aws_apigatewayv2_api.http_api "$API_ID" || true
            terraform import aws_apigatewayv2_integration.api_proxy "${API_ID}/${INTEGRATION_ID}" || true
            terraform import aws_apigatewayv2_route.proxy_route "${API_ID}/${ROUTE_ID}" || true
            terraform import aws_apigatewayv2_stage.default "${API_ID}/\$default" || true
          fi

          terraform apply -auto-approve

          # Sincroniza a senha mestre do RDS definida em variables.tf (pois terraform import nao traz a senha)
          DB_PASS=$(grep -A 5 'variable "db_password"' variables.tf | grep 'default' | cut -d '"' -f 2)
          if [ -n "$DB_PASS" ]; then
            echo "Sincronizando senha mestre do RDS PostgreSQL com variables.tf..."
            aws rds modify-db-instance \
              --db-instance-identifier acordos-juridicos-prod-db \
              --master-user-password "$DB_PASS" \
              --apply-immediately \
              --region "$AWS_REGION" > /dev/null
            aws rds wait db-instance-available \
              --db-instance-identifier acordos-juridicos-prod-db \
              --region "$AWS_REGION" || true
          fi

      - name: Publicar no Amazon ECR, atualizar ECS Fargate e vincular API Gateway
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          ECR_REPO="${ECR_REGISTRY}/acordos-juridicos-prod-repo"

          echo "=== 1. Login e Push da Imagem no Amazon ECR (${ECR_REPO}) ==="
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker tag acordos-juridicos-aws:${{ github.sha }} "${ECR_REPO}:latest"
          docker tag acordos-juridicos-aws:${{ github.sha }} "${ECR_REPO}:${{ github.sha }}"
          docker push "${ECR_REPO}:latest"
          docker push "${ECR_REPO}:${{ github.sha }}"

          echo "=== 2. Reiniciando Task no Amazon ECS Fargate ==="
          OLD_TASKS=$(aws ecs list-tasks --cluster acordos-juridicos-prod-cluster --service-name acordos-juridicos-prod-api-service --desired-status RUNNING --region "$AWS_REGION" --query "taskArns[]" --output text)
          for TASK in $OLD_TASKS; do
            if [ -n "$TASK" ] && [ "$TASK" != "None" ]; then
              aws ecs stop-task --cluster acordos-juridicos-prod-cluster --task "$TASK" --reason "GitHub Actions CI/CD Deploy (${{ github.sha }})" --region "$AWS_REGION" > /dev/null
            fi
          done

          aws ecs update-service \
            --cluster acordos-juridicos-prod-cluster \
            --service acordos-juridicos-prod-api-service \
            --force-new-deployment \
            --region "$AWS_REGION" > /dev/null

          echo "=== 3. Aguardando nova Task Fargate entrar em RUNNING e obter IP Publico ==="
          PUBLIC_IP=""
          for i in $(seq 1 24); do
            sleep 5
            TASK_ARN=$(aws ecs list-tasks --cluster acordos-juridicos-prod-cluster --service-name acordos-juridicos-prod-api-service --desired-status RUNNING --region "$AWS_REGION" --query "taskArns[0]" --output text)
            if [ -n "$TASK_ARN" ] && [ "$TASK_ARN" != "None" ]; then
              ENI_ID=$(aws ecs describe-tasks --cluster acordos-juridicos-prod-cluster --tasks "$TASK_ARN" --region "$AWS_REGION" --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value" --output text)
              if [ -n "$ENI_ID" ] && [ "$ENI_ID" != "None" ]; then
                IP=$(aws ec2 describe-network-interfaces --network-interface-ids "$ENI_ID" --region "$AWS_REGION" --query "NetworkInterfaces[0].Association.PublicIp" --output text)
                if [ -n "$IP" ] && [ "$IP" != "None" ]; then
                  PUBLIC_IP="$IP"
                  break
                fi
              fi
            fi
          done

          if [ -z "$PUBLIC_IP" ]; then
            echo "Erro: Nao foi possivel obter o IP publico da nova task ECS dentro do tempo limite."
            exit 1
          fi
          echo "Novo IP publico da Task ECS: ${PUBLIC_IP}"

          echo "=== 4. Atualizando Integracao HTTP_PROXY no Amazon API Gateway ==="
          API_ID=$(aws apigatewayv2 get-apis --region "$AWS_REGION" --query "Items[?Name=='acordos-juridicos-prod-http-api'].ApiId | [0]" --output text)
          INTEGRATION_ID=$(aws apigatewayv2 get-integrations --api-id "$API_ID" --region "$AWS_REGION" --query "Items[0].IntegrationId" --output text)

          aws apigatewayv2 update-integration \
            --api-id "$API_ID" \
            --integration-id "$INTEGRATION_ID" \
            --integration-uri "http://${PUBLIC_IP}:8000/{proxy}" \
            --region "$AWS_REGION" > /dev/null

          echo "Deploy concluido! API Gateway https://${API_ID}.execute-api.${AWS_REGION}.amazonaws.com apontando para http://${PUBLIC_IP}:8000"
