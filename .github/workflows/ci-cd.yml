name: CI/CD - Acordos Juridicos AWS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  PYTHON_VERSION: "3.12"
  AWS_REGION: "us-east-2"

jobs:
  lint-and-test:
    name: Qualidade, Lint (Ruff) e Testes (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Analisar código com Ruff (Linter)
        run: |
          ruff check shared services tests

      - name: Executar Testes Unitários e de Integração com Cobertura
        run: |
          pytest --cov=shared --cov=services --cov-report=term-missing --cov-fail-under=85

  terraform-validate:
    name: Validação de Infraestrutura como Código (Terraform)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Terraform Format Check & Validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate

  auto-pr-develop-to-main:
    name: Abrir PR Automático (develop -> main)
    runs-on: ubuntu-latest
    needs: [lint-and-test, terraform-validate]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    steps:
      - name: Criar ou verificar Pull Request de develop para main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list --repo "${{ github.repository }}" --head develop --base main --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            echo "Pull Request #$EXISTING_PR já está aberto e foi atualizado automaticamente."
          else
            gh pr create \
              --repo "${{ github.repository }}" \
              --base main \
              --head develop \
              --title "chore(release): merge develop into main (${{ github.sha }})" \
              --body "Pull Request criado automaticamente pelo GitHub Actions após aprovação nos testes unitários, integração (Pytest) e validação do Terraform."
          fi

  docker-build-and-deploy:
    name: Build Docker & Deploy AWS ECR/ECS/API Gateway
    runs-on: ubuntu-latest
    needs: [lint-and-test, terraform-validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ECR_REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Validar build da imagem Docker
        run: |
          docker build -t acordos-juridicos-aws:${{ github.sha }} .

      - name: Publicar no Amazon ECR, atualizar ECS Fargate e vincular API Gateway
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          ECR_REPO="${ECR_REGISTRY}/acordos-juridicos-prod-repo"

          echo "=== 1. Login e Push da Imagem no Amazon ECR (${ECR_REPO}) ==="
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker tag acordos-juridicos-aws:${{ github.sha }} "${ECR_REPO}:latest"
          docker tag acordos-juridicos-aws:${{ github.sha }} "${ECR_REPO}:${{ github.sha }}"
          docker push "${ECR_REPO}:latest"
          docker push "${ECR_REPO}:${{ github.sha }}"

          echo "=== 2. Reiniciando Task no Amazon ECS Fargate ==="
          OLD_TASKS=$(aws ecs list-tasks --cluster acordos-juridicos-prod-cluster --service-name acordos-juridicos-prod-api-service --desired-status RUNNING --region "$AWS_REGION" --query "taskArns[]" --output text)
          for TASK in $OLD_TASKS; do
            if [ -n "$TASK" ] && [ "$TASK" != "None" ]; then
              aws ecs stop-task --cluster acordos-juridicos-prod-cluster --task "$TASK" --reason "GitHub Actions CI/CD Deploy (${{ github.sha }})" --region "$AWS_REGION" > /dev/null
            fi
          done

          aws ecs update-service \
            --cluster acordos-juridicos-prod-cluster \
            --service acordos-juridicos-prod-api-service \
            --force-new-deployment \
            --region "$AWS_REGION" > /dev/null

          echo "=== 3. Aguardando nova Task Fargate entrar em RUNNING e obter IP Publico ==="
          PUBLIC_IP=""
          for i in $(seq 1 24); do
            sleep 5
            TASK_ARN=$(aws ecs list-tasks --cluster acordos-juridicos-prod-cluster --service-name acordos-juridicos-prod-api-service --desired-status RUNNING --region "$AWS_REGION" --query "taskArns[0]" --output text)
            if [ -n "$TASK_ARN" ] && [ "$TASK_ARN" != "None" ]; then
              ENI_ID=$(aws ecs describe-tasks --cluster acordos-juridicos-prod-cluster --tasks "$TASK_ARN" --region "$AWS_REGION" --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value" --output text)
              if [ -n "$ENI_ID" ] && [ "$ENI_ID" != "None" ]; then
                IP=$(aws ec2 describe-network-interfaces --network-interface-ids "$ENI_ID" --region "$AWS_REGION" --query "NetworkInterfaces[0].Association.PublicIp" --output text)
                if [ -n "$IP" ] && [ "$IP" != "None" ]; then
                  PUBLIC_IP="$IP"
                  break
                fi
              fi
            fi
          done

          if [ -z "$PUBLIC_IP" ]; then
            echo "Erro: Nao foi possivel obter o IP publico da nova task ECS dentro do tempo limite."
            exit 1
          fi
          echo "Novo IP publico da Task ECS: ${PUBLIC_IP}"

          echo "=== 4. Atualizando Integracao HTTP_PROXY no Amazon API Gateway ==="
          API_ID=$(aws apigatewayv2 get-apis --region "$AWS_REGION" --query "Items[?Name=='acordos-juridicos-prod-http-api'].ApiId | [0]" --output text)
          INTEGRATION_ID=$(aws apigatewayv2 get-integrations --api-id "$API_ID" --region "$AWS_REGION" --query "Items[0].IntegrationId" --output text)

          aws apigatewayv2 update-integration \
            --api-id "$API_ID" \
            --integration-id "$INTEGRATION_ID" \
            --integration-uri "http://${PUBLIC_IP}:8000/{proxy}" \
            --region "$AWS_REGION" > /dev/null

          echo "Deploy concluido! API Gateway https://${API_ID}.execute-api.${AWS_REGION}.amazonaws.com apontando para http://${PUBLIC_IP}:8000"
