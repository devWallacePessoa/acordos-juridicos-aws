name: CI/CD - Acordos Juridicos AWS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  PYTHON_VERSION: "3.12"
  AWS_REGION: "us-east-2"

jobs:
  lint-and-test:
    name: Qualidade, Lint (Ruff) e Testes (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Analisar código com Ruff (Linter)
        run: |
          ruff check shared services tests

      - name: Executar Testes Unitários e de Integração com Cobertura
        run: |
          pytest --cov=shared --cov=services --cov-report=term-missing --cov-fail-under=85

  terraform-validate:
    name: Validação de Infraestrutura como Código (Terraform)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Terraform Format Check & Validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate

  auto-pr-develop-to-main:
    name: Abrir PR Automático (develop -> main)
    runs-on: ubuntu-latest
    needs: [lint-and-test, terraform-validate]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    steps:
      - name: Criar ou verificar Pull Request de develop para main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list --repo "${{ github.repository }}" --head develop --base main --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            echo "Pull Request #$EXISTING_PR já está aberto e foi atualizado automaticamente."
          else
            gh pr create \
              --repo "${{ github.repository }}" \
              --base main \
              --head develop \
              --title "chore(release): merge develop into main (${{ github.sha }})" \
              --body "Pull Request criado automaticamente pelo GitHub Actions após aprovação nos testes unitários, integração (Pytest) e validação do Terraform."
          fi

  docker-build-and-deploy:
    name: Build Docker & Deploy AWS ECR/ECS
    runs-on: ubuntu-latest
    needs: [lint-and-test, terraform-validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ECR_REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Validar build da imagem Docker
        run: |
          docker build -t acordos-juridicos-aws:${{ github.sha }} .

      - name: Publicar no Amazon ECR (quando credenciais AWS estiverem configuradas)
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.AWS_ECR_REGISTRY != ''
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ECR_REGISTRY
          docker tag acordos-juridicos-aws:${{ github.sha }} $AWS_ECR_REGISTRY/acordos-juridicos-prod-repo:latest
          docker push $AWS_ECR_REGISTRY/acordos-juridicos-prod-repo:latest
